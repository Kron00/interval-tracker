name: IntervalTracker
options:
  bundleIdPrefix: com.kron00
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  IntervalCore:
    path: IntervalCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  IntervalTracker:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: IntervalCore
      - target: IntervalTrackerWidgets
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Intervals
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kron00.IntervalTracker
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  IntervalTrackerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Intervals
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kron00.IntervalTracker.Widgets
        TARGETED_DEVICE_FAMILY: "1"
  IntervalTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: IntervalTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kron00.IntervalTracker.Tests
  IntervalTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AppUITests
    dependencies:
      - target: IntervalTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kron00.IntervalTracker.UITests
schemes:
  IntervalTracker:
    build:
      targets:
        IntervalTracker: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IntervalTrackerTests
        - IntervalTrackerUITests
